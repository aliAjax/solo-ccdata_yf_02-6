<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>离线物料需求计划台 · MRP Workbench</title>
<style>
:root{
  --ink:#1b2733;--muted:#66768a;--line:#dce3ea;--bg:#f3f6f9;
  --blue:#1f6feb;--blue-bg:#eaf2ff;--red:#d12f2f;--red-bg:#fdecec;
  --amber:#b25f00;--amber-bg:#fff4e0;--green:#1a7f4b;--green-bg:#e8f7ef;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.app{max-width:1380px;margin:0 auto;padding:18px 20px 60px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.logo{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
.logo .dot{width:32px;height:32px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:17px}
.top .sub{color:var(--muted);font-size:12px}
.top .spacer{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--blue);color:var(--blue)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
button.primary:hover{color:#fff;filter:brightness(1.08)}
button.danger:hover{border-color:var(--red);color:var(--red)}
button.small{padding:3px 9px;font-size:12px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;padding:9px 16px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;background:none}
.tab:hover{color:var(--blue)}
.tab.active{background:#fff;border-color:var(--line);color:var(--blue);position:relative;top:1px}

.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{font-size:14px;margin:0 0 4px}
.panel .hint{color:var(--muted);font-size:12px;margin:0 0 12px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:0;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 8px;white-space:nowrap}
td{padding:4px 6px}
tr.row-err td{background:var(--red-bg)}
input,select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid #9ec1ff;outline-offset:-1px;border-color:var(--blue)}
input.bad{border-color:var(--red);background:#fff7f7}
table input,table select{border-color:transparent;background:transparent}
table input:focus,table select:focus{border-color:var(--blue);background:#fff}
td.num input{text-align:right}
.addrow{margin-top:10px}
.tiny{font-size:11px;color:var(--muted)}
.del{border:none;color:#a3b0bf;padding:2px 7px;font-size:14px;background:none}
.del:hover{color:var(--red)}

.banner{border-radius:10px;padding:12px 14px;margin-bottom:14px;border:1px solid;font-size:13px}
.banner.ok{background:var(--green-bg);border-color:#b6e2cb;color:var(--green)}
.banner.err{background:var(--red-bg);border-color:#f3b9b9;color:var(--red)}
.banner.warn{background:var(--amber-bg);border-color:#f2d39b;color:var(--amber)}
.banner b{display:block;margin-bottom:6px;font-size:13px}
.banner ul{margin:6px 0 0;padding-left:18px}
.banner li{margin:3px 0}

.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{flex:1;min-width:110px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fcfdff}
.kpi .v{font-size:20px;font-weight:800}
.kpi .k{font-size:11px;color:var(--muted)}
.kpi.bad .v{color:var(--red)}
.kpi.warn .v{color:var(--amber)}

.results table td.num,.results table th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#eef2f6;color:var(--muted)}
.pill.lvl0{background:var(--blue-bg);color:var(--blue)}
.pill.short{background:var(--red-bg);color:var(--red)}
.scroll{overflow-x:auto}
.src{font-size:11px;color:var(--muted);margin-top:2px}
.stock-tag{color:var(--green);font-weight:700}
.netzero{color:var(--muted)}
.saved{font-size:11px;color:var(--muted);white-space:nowrap}
html,body{overflow-x:hidden}
.app{width:100%;max-width:100%}
.panel{min-width:0}
.scroll{max-width:100%;-webkit-overflow-scrolling:touch}
.src{word-break:break-word;overflow-wrap:anywhere}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
@media(max-width:640px){
  .app{padding:12px 10px 40px}
  header.top{gap:10px}
  .logo{font-size:17px}
  .top .sub{flex-basis:100%;order:3}
  .top .spacer{gap:6px}
  .top .spacer button{padding:7px 10px;font-size:12px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tab{white-space:nowrap;padding:8px 12px}
  .panel{padding:12px 10px;border-radius:10px}
  .summary{gap:6px}
  .kpi{min-width:calc(50% - 6px);padding:8px 10px}
  .kpi .v{font-size:17px}
  table{font-size:12px}
  th{padding:5px 6px}
  td{padding:3px 4px}
  input,select{font-size:16px;padding:7px 8px} /* ≥16px 防止 iOS 聚焦自动放大 */
  table input,table select{font-size:16px}
  .del{padding:2px 5px}
  .banner{font-size:12px;padding:10px 12px}
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="logo"><span class="dot">物</span>离线物料需求计划台</div>
    <div class="sub">纯浏览器离线运行 · 数据仅保存在本机 localStorage · 每次点算完整重算</div>
    <div class="spacer">
      <span class="saved" id="savedAt"></span>
      <button id="btnRun" class="primary">▶ 点算（重新计算）</button>
      <button id="btnSeed">载入示例</button>
      <button id="btnExport">导出 JSON</button>
      <button id="btnImport">导入 JSON</button>
      <button id="btnClear" class="danger">清空全部</button>
      <input type="file" id="fileImport" accept="application/json,.json" hidden>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <div class="tab active" data-tab="orders">成品订单</div>
    <div class="tab" data-tab="materials">物料 / 提前期</div>
    <div class="tab" data-tab="inventories">库存（按可用日期）</div>
    <div class="tab" data-tab="boms">多层 BOM</div>
  </nav>

  <div id="errorBanner"></div>

  <div class="grid">
    <section class="panel" id="editorPanel"></section>
    <section class="panel results" id="resultPanel"></section>
  </div>
</main>

<script src="mrp.js"></script>
<script src="app.js"></script>
</body>
</html>
